<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Lost &amp; Found Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="corkboard">
  <div id="nav-root"></div>
  <div class="hero">
    <h1>Join the Board</h1>
    <p>Create an account to start reporting and claiming items.</p>
  </div>
</header>

<main class="page">
  <div class="card card-narrow">
    <h2>Create Account</h2>
    <form id="register-form">
      <label for="name">Full name</label>
      <input type="text" id="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="phone">Phone</label>
      <input type="text" id="phone" placeholder="Optional">

      <label for="password">Password</label>
      <input type="password" id="password" minlength="6" required>

      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      <div id="error-box"></div>
      <div id="success-box"></div>
    </form>
    <p class="form-footnote">Already registered? <a href="login.html">Log in</a></p>
  </div>
</main>

<footer class="site-footer">Lost &amp; Found Portal — a community project</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
  renderNav("register");

  document.getElementById("register-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("error-box");
    const successBox = document.getElementById("success-box");
    errorBox.innerHTML = "";
    successBox.innerHTML = "";

    const payload = {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      password: document.getElementById("password").value,
    };

    try {
      const user = await api.register(payload);
      saveSession(user);
      successBox.innerHTML = `<div class="form-success">Account created. Redirecting…</div>`;
      setTimeout(() => (window.location.href = "dashboard.html"), 700);
    } catch (err) {
      errorBox.innerHTML = `<div class="form-error">${err.message}</div>`;
    }
  });
</script>
</body>
</html>
