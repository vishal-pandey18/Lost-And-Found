<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Found Item — Lost &amp; Found Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="corkboard">
  <div id="nav-root"></div>
  <div class="hero">
    <h1>Report a Found Item</h1>
    <p>Pin up what you found so its owner can spot it and reach out.</p>
  </div>
</header>

<main class="page">
  <div class="card card-narrow">
    <h2>Found Item Details</h2>
    <form id="found-form">
      <label for="title">Title</label>
      <input type="text" id="title" placeholder="e.g. Set of keys with a red keychain" required>

      <label for="description">Description</label>
      <textarea id="description" placeholder="Any identifying details that would help the owner confirm it's theirs."></textarea>

      <label for="category">Category</label>
      <input type="text" id="category" placeholder="e.g. Keys, Bags, Electronics">

      <label for="color">Color</label>
      <input type="text" id="color" placeholder="e.g. Red">

      <label for="location">Found location</label>
      <input type="text" id="location" placeholder="e.g. Cafeteria">

      <label for="foundDate">Date found</label>
      <input type="date" id="foundDate" required>

      <label for="image">Photo (optional)</label>
      <input type="file" id="image" accept="image/*">

      <button type="submit" class="btn btn-primary btn-block">Pin This Report</button>
      <div id="error-box"></div>
      <div id="success-box"></div>
    </form>
  </div>
</main>

<footer class="site-footer">Lost &amp; Found Portal — a community project</footer>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/nav.js"></script>
<script>
  const user = requireAuth();
  renderNav("report-found");

  document.getElementById("found-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorBox = document.getElementById("error-box");
    const successBox = document.getElementById("success-box");
    errorBox.innerHTML = "";
    successBox.innerHTML = "";

    const formData = new FormData();
    formData.append("title", document.getElementById("title").value.trim());
    formData.append("description", document.getElementById("description").value.trim());
    formData.append("category", document.getElementById("category").value.trim());
    formData.append("color", document.getElementById("color").value.trim());
    formData.append("location", document.getElementById("location").value.trim());
    formData.append("foundDate", document.getElementById("foundDate").value);

    const imageFile = document.getElementById("image").files[0];
    if (imageFile) formData.append("image", imageFile);

    try {
      await apiFetch(`/found?userId=${user.id}`, { method: "POST", body: formData });
      successBox.innerHTML = `<div class="form-success">Report pinned. Redirecting to your dashboard…</div>`;
      setTimeout(() => (window.location.href = "dashboard.html"), 700);
    } catch (err) {
      errorBox.innerHTML = `<div class="form-error">${err.message}</div>`;
    }
  });
</script>
</body>
</html>
